<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>TV Wall - NetCheck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body {
  margin:0; background:#000814; color:#fff;
  font-family:Tahoma,Arial; overflow:hidden;
}
.box {
  width:32%; display:inline-block; margin:0.3%;
  background:#001d3d; padding:14px; border-radius:10px;
  text-align:center; vertical-align:top;
}
.host { font-size:20px; font-weight:bold; direction:ltr; }
.ok  { color:#10b981; }
.bad { color:#ef4444; animation:blink 1s infinite; }
@keyframes blink { 50% {opacity:.2;} }
.note { font-size:14px; opacity:.6; margin-top:6px; }
</style>
</head>
<body>

<div id="wrap"></div>
<audio id="alarm" src="/static/static_alarm.wav" loop></audio>

<script>
window.onerror = function(msg, src, line){
  document.body.innerHTML = 
    '<div style="color:#fff;padding:20px;font-size:18px">' +
    'JS Error:<br>' + msg + '<br>' + src + ':' + line +
    '</div>';
};

var last = {};
var muted = false;

document.body.addEventListener('click', function(){ 
  document.getElementById('alarm').play().catch(function(){});
}, {once:true});

function request(url, cb){
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      if(xhr.status === 200) cb(null, JSON.parse(xhr.responseText));
      else cb('error');
    }
  };
  xhr.open('GET', url, true);
  xhr.send();
}

function refresh(){
  request('/api/status', function(err, data){
    if(err) return;
    var targets = Array.isArray(data) ? data :
                  data.targets ? data.targets :
                  data.data ? data.data : [];
    var wrap = document.getElementById('wrap');
    wrap.innerHTML = '';
    var down = 0;

    for(var i=0;i<targets.length;i++){
      var t = targets[i];
      var ok = t.last_status ? true : false;
      if(!ok) down++;

      var timeStr = '-';
      if(t.last_checked){
        var d = new Date(t.last_checked);
        if(!isNaN(d)) timeStr = d.toLocaleTimeString('fa-IR',{hour12:false});
      }

      var prev = last[t.id];
      last[t.id] = ok;
      if(prev !== undefined && prev===true && ok===false && !muted){
        document.getElementById('alarm').play().catch(function(){});
      }

      wrap.innerHTML +=
        '<div class="box">' +
          '<div class="host">'+ (t.host||'') +'</div>' +
          '<div class="'+(ok?'ok':'bad')+'">'+ (ok?'✅ آنلاین':'❌ قطع') +'</div>' +
          '<div class="note">'+ timeStr +'</div>' +
        '</div>';
    }

    if(down===0) document.getElementById('alarm').pause();
  });
}

setInterval(refresh, 3000);
refresh();
</script>

</body>
</html>
