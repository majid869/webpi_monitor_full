<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetCheck TV Monitor</title>
<style>
* {
    box-sizing: border-box;
    font-family: "B Nazanin", "B Traffic", Tahoma, "Times New Roman", sans-serif;
}

body {
    margin:0;
    background:#0f1724;
    color:#e6eef8;
    font-family: Tahoma, "Times New Roman", sans-serif;
}
.header {
    padding:12px;
    font-weight:bold;
    font-size:1.2em;
    background:#0b1220;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.btn-home {
    background:#10b981;
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
.container {
    padding:12px;
}
.card {
    background:#0b1220;
    margin-bottom:10px;
    padding:10px;
    border-radius:6px;
}
.status-dot {
    display:inline-block;
    width:16px;
    height:16px;
    border-radius:50%;
}
.status-ok { background:#10b981; }
.status-bad { background:#ef4444; }
.table {
    width:100%;
    border-collapse:collapse;
}
th, td {
    padding:6px;
    border-bottom:1px solid #333;
    text-align:center;
}
.summary-box {
    display:inline-block;
    background:#071423;
    padding:8px 12px;
    margin:4px;
    border-radius:6px;
}
</style>
</head>
<body>
<div class="header">
    <div>NetCheck TV Monitor</div>
    <button class="btn-home" onclick="location.href='/monitor'">🏠 خانه</button>
</div>

<div class="container">
    <div class="card">
        <strong>خلاصه وضعیت:</strong>
        <div id="summary">
            <span class="summary-box">کل اهداف: 0</span>
            <span class="summary-box">آنلاین: 0</span>
            <span class="summary-box">قطع: 0</span>
        </div>
    </div>

    <div class="card">
        <table class="table" id="tbl">
            <thead>
                <tr>
                    <th>وضعیت</th>
                    <th>Host</th>
                    <th>پروتکل</th>
                    <th>دوره(s)</th>
                    <th>آخرین چک</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
var last = {};
function api(path, callback) {
    fetch(path).then(function(r){
        if(!r.ok) throw new Error("API error");
        return r.json();
    }).then(function(data){
        callback(null, data);
    }).catch(function(err){
        console.log(err);
        callback(err);
    });
}

function formatTime(ts) {
    if(!ts) return '-';
    var d = new Date(ts);
    return ('0'+d.getHours()).slice(-2) + ':' +
           ('0'+d.getMinutes()).slice(-2) + ':' +
           ('0'+d.getSeconds()).slice(-2);
}

function refresh() {
    api('/api/status', function(err, data){
        if(err) return;
        var tbody = document.getElementById('tbl').getElementsByTagName('tbody')[0];
        tbody.innerHTML = '';
        var total=0, ok=0, down=0;
        for(var i=0; i<data.targets.length; i++){
            var t = data.targets[i];
            total++;
            var s = !!t.last_status;
            if(s) ok++; else down++;

            var tr = document.createElement('tr');
            var dot = document.createElement('span');
            dot.className = 'status-dot ' + (s ? 'status-ok' : 'status-bad');
            var lastCheck = formatTime(t.last_checked);

            tr.innerHTML = '<td></td><td>'+t.host+'</td><td>'+t.protocol+'</td><td>'+t.interval+'</td><td>'+lastCheck+'</td>';
            tr.children[0].appendChild(dot);
            tbody.appendChild(tr);
        }
        document.getElementById('summary').innerHTML = 
            '<span class="summary-box">کل اهداف: '+total+'</span>'+
            '<span class="summary-box">آنلاین: '+ok+'</span>'+
            '<span class="summary-box">قطع: '+down+'</span>';
    });
}

// تازه‌سازی هر ۲ ثانیه
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
